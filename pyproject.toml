[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robinsson-lcsif"
version = "0.1.0"
description = "Language-conditioned SocialCircle trajectory forecasting with FiLM"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.27",
  "diffusers>=0.27",
  "numpy>=1.24",
  "pandas>=2.0",
  "sentencepiece>=0.1.99",
  "tensorboard>=2.14",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lcsif-train = "lcsif.train:main"
lcsif-prepare = "lcsif.preprocessing:main"
lcsif-convert-sdd = "lcsif.sdd:main"

[tool.setuptools.packages.find]
include = ["lcsif*"]

[tool.ruff]
line-length = 100
target-version = "py310"

